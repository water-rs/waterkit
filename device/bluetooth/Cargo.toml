[package]
name = "waterkit-bluetooth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform Bluetooth (BLE and Classic)"
keywords = ["bluetooth", "ble", "wireless"]
categories = ["os", "hardware-support"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
futures = { workspace = true }
futures-core = "0.3"
async-channel = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { workspace = true }
waterkit-core = { workspace = true }
objc2-core-bluetooth = { workspace = true, features = [
    "std",
    "CBAttribute",
    "CBAdvertisementData",
    "CBCentralManager",
    "CBCentralManagerConstants",
    "CBCharacteristic",
    "CBManager",
    "CBPeer",
    "CBPeripheral",
    "CBService",
    "CBUUID",
    "bitflags",
    "dispatch2",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSValue",
    "NSObject",
    "NSString",
    "NSUUID",
] }
dispatch2 = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
waterkit-build.workspace = true
ndk-context.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Networking",
    "Networking_Sockets",
    "Storage_Streams",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/BluetoothHelper.kt", "src/sys/android/BleScanBridgeCallback.kt", "src/sys/android/BleGattBridgeCallback.kt", "src/sys/android/ClassicDiscoveryBridgeCallback.kt"]

[[package.metadata.waterui.android.keep]]
class = "waterkit.bluetooth.BluetoothHelper"
members = [
    "public static int getAdapterState(android.content.Context)",
    "public static android.bluetooth.le.BluetoothLeScanner startBleScan(android.content.Context, java.lang.String[], waterkit.bluetooth.BleScanCallback)",
    "public static void stopBleScan(android.bluetooth.le.BluetoothLeScanner, android.bluetooth.le.ScanCallback)",
    "public static android.bluetooth.BluetoothGatt connectGatt(android.content.Context, java.lang.String, android.bluetooth.BluetoothGattCallback)",
    "public static android.bluetooth.BluetoothDevice[] getPairedDevices(android.content.Context)",
    "public static boolean startClassicDiscovery(android.content.Context, waterkit.bluetooth.ClassicDiscoveryCallback)",
    "public static void stopClassicDiscovery(android.content.Context)",
    "public static android.bluetooth.BluetoothSocket connectSpp(android.content.Context, java.lang.String, java.lang.String)",
    "public static byte[] readSpp(android.bluetooth.BluetoothSocket, int)",
    "public static int writeSpp(android.bluetooth.BluetoothSocket, byte[])",
    "public static void closeSpp(android.bluetooth.BluetoothSocket)",
]

[[package.metadata.waterui.android.keep]]
class = "waterkit.bluetooth.BleScanBridgeCallback"
members = [
    "public <init>()",
    "public long waterkit_scan_state",
    "public void releaseNativeState()",
    "public native void onScanResultNative(java.lang.String, java.lang.String, int, java.lang.String[])",
]

[[package.metadata.waterui.android.keep]]
class = "waterkit.bluetooth.BleGattBridgeCallback"
members = [
    "public <init>()",
    "public long waterkit_gatt_state",
    "public void releaseNativeState()",
    "public native void onConnectionStateNative(java.lang.String, boolean, int)",
    "public native void onServicesDiscoveredNative(java.lang.String, java.lang.String, int)",
    "public native void onCharacteristicReadNative(java.lang.String, java.lang.String, java.lang.String, byte[], int)",
    "public native void onCharacteristicWriteNative(java.lang.String, java.lang.String, java.lang.String, int)",
    "public native void onCharacteristicChangedNative(java.lang.String, java.lang.String, java.lang.String, byte[])",
]

[[package.metadata.waterui.android.keep]]
class = "waterkit.bluetooth.ClassicDiscoveryBridgeCallback"
members = [
    "public <init>()",
    "public long waterkit_classic_discovery_state",
    "public void releaseNativeState()",
    "public native void onDeviceFoundNative(java.lang.String, java.lang.String, int, boolean)",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-bluetooth = { workspace = true, features = [
    "Bluetooth",
    "IOBluetoothDevice",
    "IOBluetoothDeviceInquiry",
    "IOBluetoothObject",
    "IOBluetoothRFCOMMChannel",
    "IOBluetoothSDPServiceRecord",
    "IOBluetoothSDPUUID",
    "IOBluetoothTypes",
    "IOBluetoothUserLib",
    "objc2",
    "objc2-foundation",
    "std",
] }
