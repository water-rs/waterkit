[package]
name = "waterkit-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Shared primitives for waterkit (reactive Subscribed, units, identifiers, time)"
keywords = ["kit", "reactive", "waterui", "permission", "units"]
categories = ["gui", "data-structures"]

[lints]
workspace = true

[dependencies]
nami = { workspace = true }
executor-core = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
uuid = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
dispatch2.workspace = true
futures = { workspace = true, default-features = false, features = ["std"] }

[dev-dependencies]
futures = { workspace = true }
libtest-mimic = "0.8"

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-core-foundation = { workspace = true, features = ["CFRunLoop"] }
async-channel = { workspace = true }

[features]
default = []
serde = ["uuid/serde", "jiff/serde"]

[[test]]
name = "apple_on_main"
harness = false
