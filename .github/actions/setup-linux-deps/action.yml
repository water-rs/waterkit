name: Setup Linux native dependencies
description: >
  Installs the native libraries a Linux build of this workspace needs: Wayland
  and XCB, audio (ALSA, PipeWire), video (VA-API, GBM, EGL, nasm) and libclang
  for the bindgen-based crates. Every Linux job needs the same list, so it
  lives here once instead of in seven copies across the workflows — the
  copies had already drifted apart by one job, the release preflight, which
  installed nothing and failed building rustdoc because `khronos-egl` could
  not find `egl.pc`.
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get -c "$GITHUB_WORKSPACE/.github/apt.conf" update
        sudo apt-get -c "$GITHUB_WORKSPACE/.github/apt.conf" install -y \
          libwayland-dev \
          libxkbcommon-dev \
          libasound2-dev \
          libva-dev \
          libgbm-dev \
          libegl-dev \
          libpipewire-0.3-dev \
          nasm \
          libclang-dev \
          libxcb1-dev
