[package]
name = "waterkit-camera"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/water-rs/waterkit"
description = "Cross-platform camera and video streaming with GPU-first frame delivery"
keywords = ["camera", "video", "streaming", "ios", "android"]
categories = ["multimedia::video", "gui"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
thiserror = { workspace = true }
wgpu.workspace = true
futures.workspace = true
async-channel.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

shaderloom = { workspace = true, optional = true }

[build-dependencies]
waterkit-build.workspace = true
shaderloom = { workspace = true, features = ["build"], optional = true }

[features]
preview-example = ["dep:shaderloom"]
# VA-API hardware encoders on Linux; off by default like the codec's own
# `vaapi` (the software AV1 encoder still covers encoding without it).
vaapi = ["waterkit-codec/vaapi"]

[[example]]
name = "preview"
required-features = ["preview-example"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
pollster = "1.0"

# winit pulls in `android-activity`, which only builds once an application picks
# an activity backend; the preview example it serves is desktop-only.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
winit.workspace = true

# Desktop platforms (Windows, Linux) - use nokhwa. Recording encodes through
# waterkit-codec (hardware encoders plus the software AV1 fallback) and muxes
# with waterkit-video-container; `yuv` does the RGBA to NV12 conversion.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
nokhwa = { workspace = true, features = ["input-native"] }
# `software-fallback` carries the rav1e AV1 encoder; the `vaapi` feature adds
# the VA-API hardware encoders via cros-codecs on Linux.
waterkit-codec = { workspace = true, features = ["software-fallback"] }
waterkit-video-container.workspace = true
yuv = "0.8.16"

# Apple platforms (iOS, macOS) - use native AVCaptureSession
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true
objc.workspace = true
core-graphics-types = "0.2"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.build-dependencies]

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true
