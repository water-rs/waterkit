# Hardware codec support
waterkit-codec = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
ndk-context = "0.1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge = { workspace = true }
