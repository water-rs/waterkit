[package]
name = "waterkit-vision"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/water-rs/waterkit"
description = "Hardware-accelerated on-device vision requests over camera frames and still images"
keywords = ["vision", "image", "gpu", "ocr", "barcode"]
categories = ["multimedia::images", "multimedia::video"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
wgpu.workspace = true
bytes.workspace = true
enumset.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
icu_locale_core = { workspace = true, optional = true, features = ["alloc"] }
waterkit-camera = { workspace = true, optional = true }

# iOS
[target.'cfg(target_os = "ios")'.dependencies]
swift-bridge = { workspace = true, optional = true }

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true, optional = true }
ndk-context = { workspace = true, optional = true }
waterkit-build = { workspace = true, optional = true }
# Likely-subtags expansion routes a text request's languages to the script
# its ML Kit recognizer serves.
icu_locale = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "System_UserProfile",
] }

[build-dependencies]
waterkit-build.workspace = true

[features]
camera = ["dep:waterkit-camera"]
# The `DetectBarcodes` request: ML Kit's barcode engine on Android.
barcode = ["dep:jni", "dep:ndk-context", "dep:waterkit-build"]
# The `RecognizeText` request: Windows.Media.Ocr on Windows, ML Kit's script
# recognizers on Android.
text = [
    "dep:icu_locale_core",
    "dep:icu_locale",
    "dep:windows",
    "dep:jni",
    "dep:ndk-context",
    "dep:waterkit-build",
]
# The one-shot system code scanner: the Google code scanner of Google Play
# services on Android, VisionKit's `DataScannerViewController` on iOS.
scanner = [
    "dep:swift-bridge",
    "dep:jni",
    "dep:ndk-context",
    "dep:waterkit-build",
]

# Android helpers the packager compiles into the application's classpath.
# The metadata table is a single object, so the helpers ship together:
# `ScannerHelper` needs `play-services-code-scanner` and `VisionHelper` the
# unbundled ML Kit clients — thin clients each, whose engines live in Play
# services' modules, downloaded to the device on demand and never in the app.
[package.metadata.waterui.android]
kotlin-sources = [
    "src/sys/android/ScannerHelper.kt",
    "src/sys/android/VisionHelper.kt",
]
maven = [
    "com.google.android.gms:play-services-code-scanner:16.1.0",
    "com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1",
    "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1",
]

[dev-dependencies]
pollster.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
# Rasterizes the test-time text fixtures; no fonts are committed to the repo.
ab_glyph = "0.2"
image.workspace = true
