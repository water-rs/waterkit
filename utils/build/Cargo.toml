[package]
name = "waterkit-build"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Shared build utilities and Android runtime bridge for waterkit crates"
keywords = ["build", "swift", "kotlin", "automation"]
categories = ["development-tools::build-utils"]

[lints]
workspace = true

[features]
activity-result = ["dep:futures-channel"]

# The build-time half. Build scripts are compiled for the host, so these cfgs
# match the build host, not the app's target: Swift bridge generation compiles
# only on an Apple host, the one place Swift can be built, and Linux and
# Windows hosts never compile `swift-bridge-build` (or its `swift-bridge-ir` /
# `syn` 1 chain). The gate matches the `cfg`s on the helpers in `src/apple.rs`.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge-build.workspace = true

# The runtime half. Only a build *targeting* Android pulls these in, which is why
# the Swift/Kotlin toolchain never reaches an application's dependency closure.
[target.'cfg(target_os = "android")'.dependencies]
futures-channel = { workspace = true, optional = true }
jni.workspace = true
ndk-context.workspace = true
thiserror.workspace = true

[package.metadata.waterui.android.feature.activity-result]
kotlin-sources = ["src/android_runtime/ActivityResultHelper.kt"]
maven = ["androidx.activity:activity:1.11.0"]
