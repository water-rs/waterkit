[package]
name = "waterkit-permission"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Unified permission management (Camera, Mike, Location)"
keywords = ["permission", "privacy", "security", "access"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }

# Apple platforms (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
futures.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSError",
    "NSObject",
    "NSProcessInfo",
] }
objc2-av-foundation = { workspace = true, features = [
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
] }
objc2-contacts = { workspace = true, features = ["CNContactStore", "block2"] }
objc2-event-kit = { workspace = true, features = [
    "EKEventStore",
    "EKTypes",
    "block2",
] }
objc2-core-location = { workspace = true, features = [
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }
objc2-photos = { workspace = true, features = ["PHPhotoLibrary", "block2"] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
waterkit-build.workspace = true
ndk-context.workspace = true

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-channel.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Geolocation",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "PermissionState",
    "PermissionStatus",
    "Permissions",
    "Window",
] }

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/PermissionHelper.kt"]
