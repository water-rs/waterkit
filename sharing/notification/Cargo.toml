[package]
name = "waterkit-notification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "System notifications and alerts"
keywords = ["notification", "alert", "push", "toast"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
futures.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

# Desktop platforms where notify-rust does not pull in tauri-winrt-notification
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = { workspace = true }

# Windows - direct WinRT toasts through windows-rs
[target.'cfg(target_os = "windows")'.dependencies]
url = { workspace = true }
windows = { workspace = true, features = ["Data_Xml_Dom", "UI_Notifications"] }

# Linux - for opening URLs when action buttons are clicked
[target.'cfg(target_os = "linux")'.dependencies]
open = "5"

# Apple platforms (iOS, macOS) - native UserNotifications through objc2
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSError",
    "NSBundle",
    "NSObject",
    "NSProcessInfo",
    "NSSet",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { workspace = true, features = [
    "UNNotificationContent",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "block2",
] }
tracing.workspace = true

# iOS - action URLs open through UIApplication
[target.'cfg(target_os = "ios")'.dependencies]
dispatch2.workspace = true
objc2-ui-kit = { workspace = true, features = [
    "UIApplication",
    "UIResponder",
    "block2",
] }

# macOS - action URLs open through NSWorkspace
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSWorkspace"] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
async-channel.workspace = true
jni.workspace = true
ndk-context.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/NotificationHelper.kt"]

[dev-dependencies]
pollster = "1.0"
