[package]
name = "waterkit-bluetooth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform Bluetooth (BLE and Classic)"
keywords = ["bluetooth", "ble", "wireless"]
categories = ["os", "hardware-support"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
futures = { workspace = true }
futures-core = "0.3"
async-channel = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { workspace = true }
waterkit-core = { workspace = true }
objc2-core-bluetooth = { workspace = true, features = [
    "std",
    "CBAttribute",
    "CBAdvertisementData",
    "CBCentralManager",
    "CBCentralManagerConstants",
    "CBCharacteristic",
    "CBManager",
    "CBPeer",
    "CBPeripheral",
    "CBService",
    "CBUUID",
    "bitflags",
    "dispatch2",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSValue",
    "NSObject",
    "NSString",
    "NSUUID",
] }
dispatch2 = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
waterkit-build.workspace = true
ndk-context.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Networking",
    "Networking_Sockets",
    "Storage_Streams",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/BluetoothHelper.kt", "src/sys/android/BleScanBridgeCallback.kt", "src/sys/android/BleGattBridgeCallback.kt", "src/sys/android/ClassicDiscoveryBridgeCallback.kt"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-bluetooth = { workspace = true, features = [
    "Bluetooth",
    "IOBluetoothDevice",
    "IOBluetoothDeviceInquiry",
    "IOBluetoothObject",
    "IOBluetoothRFCOMMChannel",
    "IOBluetoothSDPServiceRecord",
    "IOBluetoothSDPUUID",
    "IOBluetoothTypes",
    "IOBluetoothUserLib",
    "objc2",
    "objc2-foundation",
    "std",
] }
