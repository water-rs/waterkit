[package]
name = "waterkit-contacts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform contacts access"
keywords = ["contacts", "address-book", "people"]
categories = ["os"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
futures = { workspace = true }
blocking = { workspace = true }
serde = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
waterkit-fs = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSCalendar",
    "NSError",
    "NSPredicate",
    "NSString",
] }
waterkit-core.workspace = true
objc2-contacts = { workspace = true, features = [
    "block2",
    "CNContact",
    "CNContactFetchRequest",
    "CNContactStore",
    "CNContact_Predicates",
    "CNFetchRequest",
    "CNLabeledValue",
    "CNMutableContact",
    "CNPhoneNumber",
    "CNSaveRequest",
] }

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/ContactsHelper.kt"]
