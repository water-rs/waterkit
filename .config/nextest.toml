# The automation tests share the system's display arrangement and its
# frontmost application: a display one test brings online can move another
# test's display and the window it is about to press, and some tests change
# or assert the frontmost application. They run one at a time.
[test-groups]
automation-display = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(waterkit-automation::automation)'
test-group = 'automation-display'
