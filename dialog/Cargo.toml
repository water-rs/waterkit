[package]
name = "waterkit-dialog"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Native dialogs and pickers"
keywords = ["dialog", "picker", "native", "alert"]
categories = ["os", "gui"]
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures = { workspace = true }
thiserror = { workspace = true }
waterkit-fs = { workspace = true }
roxmltree = "0.21"

# iOS
[target.'cfg(target_os = "ios")'.dependencies]
swift-bridge.workspace = true

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

# Desktop (macOS, Windows, Linux)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { workspace = true }

[build-dependencies]
waterkit-build.workspace = true

[target.'cfg(target_os = "ios")'.build-dependencies]
