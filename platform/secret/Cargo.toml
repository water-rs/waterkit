[package]
name = "waterkit-secret"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform Secure storage and keychain management"
keywords = ["secret", "keychain", "password", "security", "credentials"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# Apple (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }

# iOS has no file-backed keychain, so `apple-native-keyring-store` refuses to
# build there with only the `keychain` backend that keyring's `v1` feature
# selects. Cargo cannot enable a transitive dependency's feature from here, so
# name the store directly and let feature unification apply `protected`.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["protected"] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
