[package]
name = "waterkit-system"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "System information and power management"
keywords = ["system", "os", "thermal", "battery", "info"]
categories = ["os", "gui"]
readme = "README.md"
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# Desktop (System Info & Thermal)
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
sysinfo.workspace = true

# Windows connectivity: the Network List Manager reports internet
# connectivity, and the IP Helper adapter table names the transport.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
] }

# Linux connectivity: NetworkManager over the system bus where it runs, the
# kernel's interface and route tables otherwise.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tracing.workspace = true

# Apple (iOS/macOS)
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
swift-bridge = { workspace = true, features = [] }
swift-rs.workspace = true

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

[build-dependencies]
waterkit-build.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/SystemHelper.kt"]
