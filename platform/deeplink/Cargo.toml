[package]
name = "waterkit-deeplink"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform deep linking and URL scheme handling"
keywords = ["deeplink", "url-scheme", "universal-links"]
categories = ["os", "web-programming"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
futures = { workspace = true }
futures-core = "0.3"
async-channel = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Foundation", "System"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[build-dependencies]
waterkit-build.workspace = true
