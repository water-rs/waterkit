[package]
name = "waterkit-build"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Shared build utilities and Android runtime bridge for waterkit crates"
keywords = ["build", "swift", "kotlin", "automation"]
categories = ["development-tools::build-utils"]

[lints]
workspace = true

[features]
activity-result = ["native-callback"]
native-callback = []
swift-bridge = ["dep:swift-bridge-build"]

# The build-time half. Build scripts are compiled for the host, so these cfgs
# match the build host, not the app's target: Swift bridge generation compiles
# only on an Apple host, the one place Swift can be built, and Linux and
# Windows hosts never compile `swift-bridge-build` (or its `swift-bridge-ir` /
# `syn` 1 chain). The gate matches the `cfg`s on the helpers in `src/apple.rs`.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge-build = { workspace = true, optional = true }

# The runtime half. Only a build *targeting* Android pulls these in, which is why
# the Swift/Kotlin toolchain never reaches an application's dependency closure.
[target.'cfg(target_os = "android")'.dependencies]
futures-channel.workspace = true
jni.workspace = true
ndk-context.workspace = true
thiserror.workspace = true

# `peers.rs` is compiled under `cfg(any(test, target_os = "android"))`, so the
# test build needs the same channels and error derive as the Android glue.
[dev-dependencies]
futures-channel.workspace = true
thiserror.workspace = true

[package.metadata.waterui.android.feature.activity-result]
kotlin-sources = ["src/android_runtime/ActivityResultHelper.kt"]
maven = ["androidx.activity:activity:1.11.0"]

[[package.metadata.waterui.android.feature.activity-result.keep]]
class = "waterkit.build.ActivityResultHelper"
members = [
    "public static boolean startActivityForResult(android.content.Context, waterkit.build.NativeCallback, android.content.Intent)",
    "public static boolean startIntentSenderForResult(android.content.Context, waterkit.build.NativeCallback, android.content.IntentSender)",
]

[[package.metadata.waterui.android.feature.activity-result.keep]]
class = "androidx.activity.result.ActivityResult"
members = [
    "public int getResultCode()",
    "public android.content.Intent getData()",
]

[package.metadata.waterui.android.feature.native-callback]
kotlin-sources = [
    "src/android_runtime/NativeCallback.kt",
    "src/android_runtime/NativeChannel.kt",
]

[[package.metadata.waterui.android.feature.native-callback.keep]]
class = "waterkit.build.NativeCallback"
members = [
    "private <init>(long)",
    "private native void completeNative(long, java.lang.Object)",
    "private native void failNative(long, java.lang.String)",
]

[[package.metadata.waterui.android.feature.native-callback.keep]]
class = "waterkit.build.NativeChannel"
members = [
    "private <init>(long)",
    "private native void sendNative(long, java.lang.Object)",
    "private native void closeNative(long)",
    "private native void failNative(long, java.lang.String)",
]

[[package.metadata.waterui.android.feature.native-callback.keep]]
class = "waterkit.build.PeerNatives"
members = ["public static native void releaseNative(long)"]
