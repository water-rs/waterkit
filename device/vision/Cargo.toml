[package]
name = "waterkit-vision"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/water-rs/waterkit"
description = "Hardware-accelerated on-device vision requests over camera frames and still images"
keywords = ["vision", "image", "gpu", "ocr", "barcode"]
categories = ["multimedia::images", "multimedia::video"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
wgpu.workspace = true
bytes.workspace = true
enumset.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
icu_locale_core = { workspace = true, optional = true, features = ["alloc"] }
waterkit-camera = { workspace = true, optional = true }

# Apple platforms (iOS, macOS) - the system Vision framework.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true
serde = { workspace = true, features = ["derive"] }
# Results cross the bridge as JSON.
serde_json.workspace = true
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFDictionary", "CFString"] }
objc2-core-video = { workspace = true, features = [
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-metal.workspace = true
# The wgpu Metal backend, for recovering the `MTLTexture` an image texture is.
wgpu-hal.workspace = true

# iOS
[target.'cfg(target_os = "ios")'.dependencies]
swift-bridge = { workspace = true, optional = true }

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true, optional = true }
ndk-context = { workspace = true, optional = true }
waterkit-build = { workspace = true, optional = true }
# Likely-subtags expansion routes a text request's languages to the script
# its ML Kit recognizer serves.
icu_locale = { workspace = true, optional = true }
# Reading the scanned pages out of the result intent is content-resolver
# I/O, offloaded from the async executor's thread.
blocking = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "System_UserProfile",
] }

[build-dependencies]
waterkit-build.workspace = true

[features]
# The `DetectBarcodes` request: Apple Vision's `DetectBarcodesRequest` on
# iOS/macOS, ML Kit's barcode engine on Android. The `Barcode`/`Payload`/
# `Symbology` vocabulary compiles unconditionally for the system scanner.
barcode = ["dep:jni", "dep:ndk-context", "dep:waterkit-build"]
# `RecognizeText`: Windows.Media.Ocr on Windows, Apple Vision's
# `RecognizeTextRequest` on iOS/macOS, ML Kit's script recognizers on
# Android.
text = [
    "dep:icu_locale_core",
    "dep:icu_locale",
    "dep:windows",
    "dep:jni",
    "dep:ndk-context",
    "dep:waterkit-build",
]
# `RecognizeDocument`: a document's paragraphs, tables, lists and barcodes.
# A paragraph reports [`TextLine`]s, so the capability builds on `text`.
document = ["text"]
# Camera `Frame` and `AnalysisFrame` images through `waterkit-camera`.
camera = ["dep:waterkit-camera"]

# The one-shot system code scanner: the Google code scanner of Google Play
# services on Android, VisionKit's `DataScannerViewController` on iOS.
scanner = [
    "dep:swift-bridge",
    "dep:jni",
    "dep:ndk-context",
    "dep:waterkit-build",
    "waterkit-build/native-callback",
]

# The one-shot system document scanner: the ML Kit document scanner of
# Google Play services on Android, VisionKit's
# `VNDocumentCameraViewController` on iOS. The Android scanner's
# `IntentSender` launches through `waterkit-build`'s activity-result bridge.
document-scanner = [
    "dep:swift-bridge",
    "dep:jni",
    "dep:ndk-context",
    "dep:waterkit-build",
    "waterkit-build/activity-result",
    "waterkit-build/native-callback",
    "dep:blocking",
]

# Android helpers the packager compiles into the application's classpath:
# `feature.<name>` tables join the app only while the cargo feature is on.

[package.metadata.waterui.android.feature.scanner]
# `PlayServices.kt` hosts the shared Play services probe; every feature
# stages it, and the packager deduplicates it by filename.
kotlin-sources = [
    "src/sys/android/PlayServices.kt",
    "src/sys/android/ScannerHelper.kt",
]
# The thin client of the Google code scanner; the scanner itself is Google
# Play services' module, downloaded to the device on first use.
maven = ["com.google.android.gms:play-services-code-scanner:16.1.0"]

# ML Kit's unbundled barcode client. `MlKitInput.kt` builds the `InputImage`
# both helpers take; it is deduplicated by filename when both features are
# enabled. The engine lives in Play services' modules, downloaded on demand.
[package.metadata.waterui.android.feature.barcode]
kotlin-sources = [
    "src/sys/android/MlKitInput.kt",
    "src/sys/android/PlayServices.kt",
    "src/sys/android/VisionBarcodeHelper.kt",
]
maven = ["com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1"]

# ML Kit's unbundled script recognizers, same shape: `MlKitInput.kt` is the
# shared `InputImage` builder, and each recognizer module is delivered by
# Play services on demand.
[package.metadata.waterui.android.feature.text]
kotlin-sources = [
    "src/sys/android/MlKitInput.kt",
    "src/sys/android/PlayServices.kt",
    "src/sys/android/VisionTextHelper.kt",
]
maven = [
    "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1",
    "com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1",
]

# Android helper the packager compiles into the application's classpath.
[package.metadata.waterui.android.feature.document-scanner]
kotlin-sources = [
    "src/sys/android/DocumentScannerHelper.kt",
    "src/sys/android/PlayServices.kt",
]
# The thin client of the ML Kit document scanner; the scanner itself is
# Google Play services' module, downloaded to the device on first use.
maven = ["com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"]

[dev-dependencies]
pollster.workspace = true
image.workspace = true
# Renders a QR code at test time; no image fixture is committed.
qrcode = "0.14"
# Renders 1D symbologies at test time.
barcoders = "1"
# Rasterizes glyphs for text recognition tests.
ab_glyph = "0.2"
# A bundled DejaVu font; no font binary is committed.
dejavu = "2.37"