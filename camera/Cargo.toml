[package]
name = "waterkit-camera"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/water-rs/waterkit"
description = "Cross-platform camera and video streaming with GPU-first frame delivery"
keywords = ["camera", "video", "streaming", "ios", "android"]
categories = ["multimedia::video", "gui"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["waterkit-codec"]

[dependencies]
waterkit-core = { workspace = true }
thiserror = { workspace = true }
wgpu.workspace = true
futures.workspace = true
async-channel.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

waterkit-codec = { workspace = true, optional = true }

[build-dependencies]
waterkit-build.workspace = true

[features]
codec = ["dep:waterkit-codec"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
pollster = "0.4"
winit.workspace = true

# Desktop platforms (Windows, macOS, Linux) - use nokhwa
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
nokhwa = { workspace = true, features = ["input-native", "output-wgpu"] }

# Apple platforms (iOS, macOS) - use native AVCaptureSession
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true
metal.workspace = true
objc.workspace = true
core-graphics-types = "0.2"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.build-dependencies]

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true
