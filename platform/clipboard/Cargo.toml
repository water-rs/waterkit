[package]
name = "waterkit-clipboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform clipboard management"
keywords = ["clipboard", "copy", "paste"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
futures.workspace = true
async-channel.workspace = true
blocking.workspace = true
tracing.workspace = true

# Windows and macOS
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
clipboard-rs = { workspace = true }
image = { workspace = true }

# Linux: CLIPBOARD and PRIMARY through Wayland data-control or an X server
[target.'cfg(target_os = "linux")'.dependencies]
image = { workspace = true }
rustix = { workspace = true, features = ["event"] }
url.workspace = true
wl-clipboard-rs.workspace = true
x11rb = { workspace = true, features = ["xfixes"] }

# Apple platforms (iOS only - macOS uses clipboard-rs)
[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-core-graphics = { workspace = true, features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
] }
objc2-core-foundation.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSFileManager",
    "NSItemProvider",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
] }
objc2-ui-kit = { workspace = true, features = [
    "UIApplication",
    "UIPasteboard",
    "UIImage",
    "objc2-core-graphics",
] }
waterkit-core.workspace = true
objc2-uniform-type-identifiers = { workspace = true, features = [
    "UTType",
    "UTCoreTypes",
] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }


[dev-dependencies]
image = { workspace = true }

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/ClipboardHelper.kt", "src/sys/android/ClipboardFileProvider.kt", "src/sys/android/ClipboardWatchCallback.kt"]

# Serves the files `set_files`, `set_image` and `set_binary` put on the
# clipboard as `content://` URIs that readers of the clip are granted access to.
[[package.metadata.waterui.android.provider]]
name = "waterkit.clipboard.ClipboardFileProvider"
authorities = ["${applicationId}.waterkit.clipboard"]
exported = false
grant-uri-permissions = true
