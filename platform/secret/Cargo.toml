[package]
name = "waterkit-secret"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform Secure storage and keychain management"
keywords = ["secret", "keychain", "password", "security", "credentials"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# Apple (iOS, macOS): SecItem generic-password queries hit the platform
# keychain directly. keyring's `v1` default store and the
# `apple-native-keyring-store` protected store both rely on the
# data-protection keychain flag, which requires a `keychain-access-groups`
# entitlement that ad-hoc signed test apps cannot carry.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = "3.7"
security-framework-sys = "2"

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
