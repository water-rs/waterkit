[workspace]
resolver = "2"
members = ["tests/shared/dialog-demo", "waterkit-build", "permission", "location", "audio", "tests/android/rust", "tests/ios/rust", "tests/windows/rust", "tests/linux/rust", "tests/macos/location", "tests/macos/audio", "tests/macos/dialog", "tests/macos/biometric", "tests/macos/camera", "tests/macos/sensor", "tests/macos/codec", "tests/macos/video", "tests/macos/notification", "tests/macos/passkey", "tools/waterkit-test", "haptic", "notification", "dialog", "biometric", "clipboard", "fs", "secret", "camera", "sensor", "codec", "screen", "system", "video", "regional", "bluetooth", "nfc", "share", "speech", "contacts", "calendar", "health", "deeplink", "background", "passkey"]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/waterkit"
description = "Cross-platform kit utilities and helpers"
keywords = ["kit", "utilities", "helpers", "waterui"]
categories = ["gui", "development-tools"]

[package]
name = "waterkit"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/water-rs/waterkit"
description = "Kit utilities and helpers"
keywords = ["kit", "utilities", "helpers", "waterui"]
categories = ["gui", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
waterkit-permission = { workspace = true, optional = true }
waterkit-location = { workspace = true, optional = true }
waterkit-audio = { workspace = true, optional = true }
waterkit-haptic = { workspace = true, optional = true }
waterkit-notification = { workspace = true, optional = true }
waterkit-dialog = { workspace = true, optional = true }
waterkit-biometric = { workspace = true, optional = true }
waterkit-clipboard = { workspace = true, optional = true }
waterkit-fs = { workspace = true, optional = true }
waterkit-secret = { workspace = true, optional = true }
waterkit-camera = { workspace = true, optional = true }
waterkit-sensor = { workspace = true, optional = true }
waterkit-codec = { workspace = true, optional = true }
waterkit-screen = { workspace = true, optional = true }
waterkit-system = { workspace = true, optional = true }
waterkit-video = { workspace = true, optional = true }
waterkit-regional = { workspace = true, optional = true }
waterkit-bluetooth = { workspace = true, optional = true }
waterkit-nfc = { workspace = true, optional = true }
waterkit-share = { workspace = true, optional = true }
waterkit-speech = { workspace = true, optional = true }
waterkit-contacts = { workspace = true, optional = true }
waterkit-calendar = { workspace = true, optional = true }
waterkit-health = { workspace = true, optional = true }
waterkit-deeplink = { workspace = true, optional = true }
waterkit-background = { workspace = true, optional = true }
waterkit-passkey = { workspace = true, optional = true }

[dev-dependencies]
toml = { workspace = true }

[features]
default = ["full"]
full = [
    "permission",
    "location",
    "audio",
    "haptic",
    "notification",
    "dialog",
    "biometric",
    "clipboard",
    "fs",
    "secret",
    "camera",
    "sensor",
    "codec",
    "screen",
    "system",
    "video",
    "regional",
    "bluetooth",
    "nfc",
    "share",
    "speech",
    "contacts",
    "calendar",
    "health",
    "deeplink",
    "background",
    "passkey",
]
permission = ["dep:waterkit-permission"]
location = ["dep:waterkit-location", "permission"]
audio = ["dep:waterkit-audio"]
haptic = ["dep:waterkit-haptic"]
notification = ["dep:waterkit-notification"]
dialog = ["dep:waterkit-dialog"]
biometric = ["dep:waterkit-biometric"]
clipboard = ["dep:waterkit-clipboard"]
fs = ["dep:waterkit-fs"]
secret = ["dep:waterkit-secret"]
camera = ["dep:waterkit-camera"]
sensor = ["dep:waterkit-sensor"]
codec = ["dep:waterkit-codec"]
screen = ["dep:waterkit-screen"]
system = ["dep:waterkit-system"]
video = ["dep:waterkit-video"]
regional = ["dep:waterkit-regional"]
bluetooth = ["dep:waterkit-bluetooth"]
nfc = ["dep:waterkit-nfc"]
share = ["dep:waterkit-share"]
speech = ["dep:waterkit-speech"]
contacts = ["dep:waterkit-contacts"]
calendar = ["dep:waterkit-calendar"]
health = ["dep:waterkit-health"]
deeplink = ["dep:waterkit-deeplink"]
background = ["dep:waterkit-background"]
passkey = ["dep:waterkit-passkey"]


[workspace.dependencies]
tracing = "0.1.44"
# Functional Crates
waterkit-permission = { path = "permission", version = "0.1.0" }
waterkit-location = { path = "location", version = "0.1.0" }
waterkit-audio = { path = "audio", version = "0.1.0" }
waterkit-haptic = { path = "haptic", version = "0.1.0" }
waterkit-notification = { path = "notification", version = "0.1.0" }
waterkit-dialog = { path = "dialog", version = "0.1.0" }
waterkit-biometric = { path = "biometric", version = "0.1.0" }
waterkit-clipboard = { path = "clipboard", version = "0.1.0" }
waterkit-fs = { path = "fs", version = "0.1.0" }
waterkit-secret = { path = "secret", version = "0.1.0" }
waterkit-camera = { path = "camera", version = "0.1.0" }
waterkit-sensor = { path = "sensor", version = "0.1.0" }
waterkit-codec = { path = "codec", version = "0.1.0" }
waterkit-screen = { path = "screen", version = "0.1.0" }
waterkit-system = { path = "system", version = "0.1.0" }
waterkit-video = { path = "video", version = "0.1.0" }
waterkit-regional = { path = "regional", version = "0.1.0" }
waterkit-bluetooth = { path = "bluetooth", version = "0.1.0" }
waterkit-nfc = { path = "nfc", version = "0.1.0" }
waterkit-share = { path = "share", version = "0.1.0" }
waterkit-speech = { path = "speech", version = "0.1.0" }
waterkit-contacts = { path = "contacts", version = "0.1.0" }
waterkit-calendar = { path = "calendar", version = "0.1.0" }
waterkit-health = { path = "health", version = "0.1.0" }
waterkit-deeplink = { path = "deeplink", version = "0.1.0" }
waterkit-background = { path = "background", version = "0.1.0" }
waterkit-passkey = { path = "passkey", version = "0.1.0" }

# Cross-platform
futures = "0.3"
async-channel = "2.3"
thiserror = "2"
blocking = "1"
async-io = "2"
async-process = "2"
wgpu = "27"
metal = "0.33"

# Common
log = "0.4"
cfg-if = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
image = "0.25"

# Apple
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-core-foundation = "0.3"
objc2-io-surface = "0.3"
objc = "0.2"

# Security
keyring = "3"


# Apple platforms
swift-bridge = "0.1"
swift-bridge-build = "0.1"

# Android
jni = "0.21"
ndk-context = "0.1"

# Build utilities
waterkit-build = { path = "waterkit-build", version = "0.1.0" }

# Windows
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }

# Linux
zbus = "5"

# Testing
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }


# Audio/Video
rodio = "0.19"
cpal = "0.15"
mp4 = "0.14"
byteorder = "1.5"
winit = "0.30"
pollster = "0.4"
nokhwa = { version = "0.10", features = ["input-native", "output-wgpu"] }
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
media-codec = "0.8"
timestretch = "0.2"

# Time
jiff = "0.2"

# URL encoding
percent-encoding = "2.3"
url = "2.5"

# System/OS
sysinfo = "0.37"
dirs = "6.0"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "async-std"] }
arboard = "3"
clipboard-rs = { version = "0.3", features = ["image"] }
wayland-sys = { version = "0.30.1", features = ["dlopen"] }
notify-rust = "4"
futures-timer = "3"
netdev = "0.40"
swift-rs = "1.0.6"
sys-locale = "0.3"
iana-time-zone = "0.1"

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = { level = "warn", priority = -1 }
clippy.style = { level = "warn", priority = -1 }
clippy.correctness = { level = "warn", priority = -1 }
clippy.complexity = { level = "warn", priority = -1 }
clippy.suspicious = { level = "warn", priority = -1 }
clippy.perf = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }
clippy.nursery = { level = "warn", priority = -1 }
clippy.cargo = { level = "warn", priority = -1 }
clippy.multiple_crate_versions = "allow"
