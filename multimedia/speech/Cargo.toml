[package]
name = "waterkit-speech"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform text-to-speech and speech recognition"
keywords = ["tts", "speech", "voice", "recognition"]
categories = ["multimedia::audio", "accessibility"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
futures-core = "0.3"
async-channel = { workspace = true }
futures-timer = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
objc2-avf-audio = { workspace = true, features = ["AVSpeechSynthesis"] }
objc2-foundation = { workspace = true, features = ["NSObject", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
objc2-avf-audio = { workspace = true, features = [
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioNode",
    "AVAudioTime",
    "AVAudioTypes",
    "block2",
] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSError", "NSLocale"] }
objc2-speech = { workspace = true, features = [
    "block2",
    "objc2-avf-audio",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognizer",
    "SFTranscription",
    "SFTranscriptionSegment",
] }

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Media_SpeechSynthesis",
    "Media_SpeechRecognition",
    "Media_Core",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Globalization",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
async-process.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/SpeechHelper.kt", "src/sys/android/SpeechInitCallback.kt"]

[[package.metadata.waterui.android.keep]]
class = "waterkit.speech.SpeechHelper"
members = [
    "public static void initTts(android.content.Context, waterkit.speech.SpeechInitCallback)",
    "public static void speak(java.lang.String, float, float, float, java.lang.String)",
    "public static void stop()",
    "public static boolean isSpeaking()",
    "public static java.lang.String[] getAvailableVoices()",
    "public static void shutdown()",
    "public static boolean isRecognitionAvailable(android.content.Context)",
    "public static boolean startRecognition(android.content.Context, java.lang.String, boolean, long)",
    "public static void stopRecognition()",
    "public static native void onRecognitionResult(long, java.lang.String, boolean, float)",
    "public static native void onRecognitionError(long, int)",
]

[[package.metadata.waterui.android.keep]]
class = "waterkit.speech.SpeechInitCallback"
members = [
    "public <init>()",
    "public long waterkit_tts_init_tx",
    "public native void onTtsInit(boolean)",
]
