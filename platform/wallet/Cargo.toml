[package]
name = "waterkit-wallet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Native Google Wallet and Apple Wallet pass flows"
keywords = ["wallet", "passes", "google-wallet", "apple-wallet"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
base64 = "0.22"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
waterkit-core.workspace = true
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
waterkit-build = { workspace = true, features = ["activity-result"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSObject",
    "NSString",
] }
objc2-pass-kit = { workspace = true, features = [
    "block2",
    "PKObject",
    "PKPass",
    "PKPassLibrary",
] }
objc2-ui-kit = { workspace = true, features = [
    "block2",
    "UIApplication",
    "UIResponder",
    "UIScene",
    "UISceneDefinitions",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }

[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/WalletHelper.kt", "src/sys/android/SavePassesActivity.kt"]
maven = ["com.google.android.gms:play-services-pay:16.5.0", "com.google.android.gms:play-services-base:18.5.0"]

# The Google Wallet save flow runs in this library-owned trampoline activity:
# the Wallet API delivers its result to the activity's `onActivityResult`,
# which forwards it as its own result to the shared activity-result bridge.
[[package.metadata.waterui.android.activity]]
name = "waterkit.wallet.SavePassesActivity"
exported = false
theme = "@android:style/Theme.Translucent.NoTitleBar"
exclude-from-recents = true