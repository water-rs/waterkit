# release-plz configuration
# https://release-plz.ieni.dev/docs/config

[workspace]
# Longer timeout for large workspace with many crates
publish_timeout = "30m"

# Allow dependencies from same workspace
allow_dirty = false

# Git release settings
git_release_enable = true
git_tag_enable = true

# waterkit#367: filtrate's executor API is only on water-rs/waterui's dev, so
# this crate builds through a `[patch.crates-io]` git pin that crates.io drops.
# It stays at the published 0.1.4 until filtrate is published again.
[[package]]
name = "waterkit-video-processing"
release = false

# waterkit#367: the semver check builds every feature from a copy outside the
# workspace, where the `[patch.crates-io]` filtrate pin does not apply, so the
# `filtrate` feature cannot compile there. Published consumers resolve
# waterkit-video-processing to the published 0.1.4, which builds.
[[package]]
name = "waterkit-video"
semver_check = false

# The published waterkit-codec 0.2.0 baseline on crates.io enables
# `cros-libva 0.0.12` under `vaapi`, which no longer compiles against
# ubuntu-latest's libva 2.23 headers when cargo-semver-checks builds the
# baseline rustdoc (`vaapi` and `cros-libva` are already removed on `main`).
[[package]]
name = "waterkit-codec"
semver_check = false
