[package]
name = "waterkit-location"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform location and GPS services"
keywords = ["location", "gps", "geolocation", "maps"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
waterkit-permission = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }

# Apple platforms (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
futures.workspace = true
dispatch2.workspace = true
tracing.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSDate",
    "NSError",
    "NSObject",
    "NSString",
] }
objc2-core-location = { workspace = true, features = [
    "CLError",
    "CLErrorDomain",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
futures.workspace = true
tracing.workspace = true
waterkit-build.workspace = true

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-channel.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Geolocation", "Navigator", "Window"] }

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/LocationHelper.kt"]
# The thin client of the Fused Location Provider; the provider itself is
# Google Play services, preinstalled on the device.
maven = ["com.google.android.gms:play-services-location:21.4.0"]
