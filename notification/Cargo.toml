[package]
name = "waterkit-notification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "System notifications and alerts"
keywords = ["notification", "alert", "push", "toast"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

# Desktop platforms (Linux, Windows, macOS unbundled)
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
notify-rust = { workspace = true }

# Linux - for opening URLs when action buttons are clicked
[target.'cfg(target_os = "linux")'.dependencies]
open = "5"

# Apple platforms (iOS, macOS) - use native UserNotifications
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

[build-dependencies]
waterkit-build.workspace = true
