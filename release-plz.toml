# release-plz configuration
# https://release-plz.ieni.dev/docs/config

[workspace]
# Longer timeout for large workspace with many crates
publish_timeout = "30m"

# Allow dependencies from same workspace
allow_dirty = false

# Git release settings
git_release_enable = true
git_tag_enable = true

# The published waterkit-codec 0.2.0 baseline on crates.io enables
# `cros-libva 0.0.12` under `vaapi`, which no longer compiles against
# ubuntu-latest's libva 2.23 headers when cargo-semver-checks builds the
# baseline rustdoc (`vaapi` and `cros-libva` are already removed on `main`).
[[package]]
name = "waterkit-codec"
semver_check = false

# Their published 0.2.0 baselines on crates.io define a `vaapi` feature that
# pulls `waterkit-codec/vaapi` -> `cros-libva 0.0.12`, which fails against
# ubuntu-latest's libva 2.23 headers during baseline rustdoc generation (`vaapi`
# is already removed on `main`).
[[package]]
name = "waterkit"
semver_check = false

# Its published 0.2.0 baseline enables `vaapi` (`waterkit-codec/vaapi` ->
# `cros-libva 0.0.12`) and the removed `filtrate` feature, so cargo-semver-checks
# cannot build the baseline rustdoc on ubuntu-latest's libva 2.23 headers.
[[package]]
name = "waterkit-video"
semver_check = false

[[package]]
name = "waterkit-camera"
semver_check = false

[[package]]
name = "waterkit-video-player"
semver_check = false

[[package]]
name = "waterkit-video-cli"
semver_check = false
