[package]
name = "waterkit-screen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Screen capture with wgpu texture output"
keywords = ["screen", "display", "capture", "gpu", "wgpu"]
categories = ["os", "gui", "multimedia"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
thiserror.workspace = true
wgpu.workspace = true
async-channel.workspace = true
blocking.workspace = true
futures.workspace = true
tracing.workspace = true

# Desktop screen capture
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
xcap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
brightness = { version = "0.8", default-features = false }

# Apple platforms (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSError", "NSObject"] }
objc2-core-foundation = { workspace = true, features = [
    "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes",
] }
objc2-core-graphics = { workspace = true, features = ["CGDirectDisplay", "CGImage"] }
objc2-image-io = { workspace = true, features = ["CGImageDestination", "objc2-core-graphics"] }
block2.workspace = true
dispatch2.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { workspace = true, features = [
    "UIApplication", "UIGraphicsImageRenderer", "UIGraphicsRenderer", "UIImage",
    "UIResponder", "UIScreen", "UIView", "UIWindow",
    "block2", "objc2-core-foundation", "objc2-core-graphics",
] }
objc2-foundation = { workspace = true, features = ["NSData"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-image = { workspace = true, features = [
    "CIContext", "CIImage", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-video",
] }
objc2-core-media = { workspace = true, features = ["CMSampleBuffer", "CMTime"] }
objc2-core-video = { workspace = true, features = [
    "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "objc2-io-surface",
] }
objc2-io-kit = { workspace = true, features = ["graphics", "libc"] }
objc2-io-surface.workspace = true
objc2-screen-capture-kit = { workspace = true, features = [
    "SCScreenshotManager", "SCShareableContent", "SCStream",
    "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media",
] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true
waterkit-build.workspace = true

[dev-dependencies]
pollster = "1.0"

# winit pulls in `android-activity`, which only builds once an application picks
# an activity backend; it is desktop-only here.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
winit = "0.30"

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/ScreenHelper.kt"]
