[package]
name = "waterkit-dialog"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Native dialogs and pickers"
keywords = ["dialog", "picker", "native", "alert"]
categories = ["os", "gui"]
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures = { workspace = true }
thiserror = { workspace = true }
waterkit-fs = { workspace = true }
roxmltree = "0.21"

# iOS
[target.'cfg(target_os = "ios")'.dependencies]
swift-bridge.workspace = true

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
waterkit-build = { workspace = true, features = ["activity-result"] }

# Desktop (macOS, Windows, Linux)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { workspace = true }

[build-dependencies]
waterkit-build.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/DialogHelper.kt"]
