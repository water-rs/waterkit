[package]
name = "waterkit-video-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Inspection and decode benchmarking tools for WaterKit video"
keywords = ["video", "cli", "probe", "benchmark"]
categories = ["multimedia::video", "command-line-utilities"]

[[bin]]
name = "waterkit-video"
path = "src/main.rs"

[dependencies]
waterkit-video-core.workspace = true
waterkit-video-container.workspace = true
waterkit-video-player.workspace = true
waterkit-video-streaming.workspace = true
waterkit-codec.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dirs.workspace = true
pollster.workspace = true
wgpu.workspace = true
num-traits.workspace = true

[lints]
workspace = true
