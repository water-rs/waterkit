name: Start an X server
description: >
  Installs Xvfb and xclip, starts a virtual X server and exports DISPLAY to the
  job's later steps through GITHUB_ENV. `waterkit-clipboard`'s CLIPBOARD and
  PRIMARY round-trip tests need an X server and cross-check the selections
  with `xclip`; they fail without them, so every job that runs the workspace
  tests on Linux uses this action.
runs:
  using: composite
  steps:
    # `-displayfd` writes the display number once the server accepts
    # connections, so reading it from the FIFO waits for readiness.
    - name: Start Xvfb
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb xclip
        mkfifo "$RUNNER_TEMP/xvfb-display"
        Xvfb -displayfd 3 -screen 0 1280x1024x24 \
          3>"$RUNNER_TEMP/xvfb-display" >"$RUNNER_TEMP/xvfb.log" 2>&1 &
        if ! read -r display < "$RUNNER_TEMP/xvfb-display"; then
          cat "$RUNNER_TEMP/xvfb.log"
          exit 1
        fi
        echo "DISPLAY=:$display" >> "$GITHUB_ENV"
