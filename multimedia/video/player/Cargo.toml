[package]
name = "waterkit-video-player"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "UI-independent decode, playback timing, and platform media integration for WaterKit video"
keywords = ["video", "player", "decoder", "media"]
categories = ["multimedia::video"]

[lints]
workspace = true

[build-dependencies]
waterkit-build.workspace = true

[dependencies]
waterkit-video-core.workspace = true
waterkit-video-container.workspace = true
waterkit-video-streaming = { workspace = true, optional = true }
waterkit-codec.workspace = true
waterkit-audio = { workspace = true, features = ["streaming", "media-session"] }
futures.workspace = true
async-channel.workspace = true
tracing.workspace = true
num-traits = "0.2"
aes = { workspace = true, optional = true }
cbc = { workspace = true, features = ["alloc"], optional = true }
bytes = { workspace = true, optional = true }

[features]
default = []
streaming = ["dep:waterkit-video-streaming", "dep:aes", "dep:cbc", "dep:bytes"]

[dev-dependencies]
transmux.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true
waterkit-audio = { workspace = true, features = ["apple-artwork"] }
