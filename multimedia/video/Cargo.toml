[package]
name = "waterkit-video"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Modular video umbrella re-exporting the mediax media crates alongside the WaterKit playback engine"
keywords = ["video", "playback", "streaming", "codec", "media"]
categories = ["multimedia::video"]

[lints]
workspace = true

[dependencies]
mediax-core.workspace = true
mediax-container = { workspace = true, optional = true }
mediax-streaming = { workspace = true, optional = true }
mediax-processing = { workspace = true, optional = true }
waterkit-video-player = { workspace = true, optional = true }

[features]
default = ["player"]
container = ["dep:mediax-container"]
streaming = ["dep:mediax-streaming", "waterkit-video-player?/streaming"]
offline = ["streaming", "mediax-streaming/offline"]
processing = ["dep:mediax-processing"]
filtrate = ["processing", "mediax-processing/filtrate"]
player = ["container", "dep:waterkit-video-player"]
# VA-API hardware decode on Linux, forwarded to the player's opt-in feature.
vaapi = ["waterkit-video-player?/vaapi"]
full = ["player", "streaming", "offline", "processing", "filtrate"]
