[package]
name = "waterkit-video-player"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "UI-independent decode, playback timing, and platform media integration for WaterKit video"
keywords = ["video", "player", "decoder", "media"]
categories = ["multimedia::video"]

[lints]
workspace = true

[build-dependencies]

[dependencies]
waterkit-build.workspace = true
waterkit-video-core.workspace = true
waterkit-video-container.workspace = true
waterkit-video-streaming = { workspace = true, optional = true }
waterkit-codec = { workspace = true, features = ["software-decode"] }
waterkit-audio = { workspace = true, features = ["streaming", "media-session"] }
futures.workspace = true
async-channel.workspace = true
tracing.workspace = true
num-traits = "0.2"
aes = { workspace = true, optional = true }
cbc = { workspace = true, features = ["alloc"], optional = true }
bytes = { workspace = true, optional = true }

[features]
default = []
streaming = ["dep:waterkit-video-streaming", "dep:aes", "dep:cbc", "dep:bytes"]
# VA-API hardware decode on Linux; off by default like the codec's own `vaapi`.
vaapi = ["waterkit-codec/vaapi"]

[dev-dependencies]
transmux.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
waterkit-audio = { workspace = true, features = ["apple-artwork"] }
block2.workspace = true
core-foundation.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = ["AVAnimation", "AVQueuedSampleBufferRendering", "AVSampleBufferDisplayLayer", "AVSampleBufferVideoRenderer", "block2", "objc2-core-media", "objc2-quartz-core"] }
objc2-av-kit = { workspace = true, features = ["AVPictureInPictureController", "AVPictureInPictureController_AVSampleBufferDisplayLayerSupport", "objc2-av-foundation"] }
objc2-core-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-metal.workspace = true
tracing.workspace = true
futures.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/PictureInPictureHelper.kt"]
