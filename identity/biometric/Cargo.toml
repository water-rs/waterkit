[package]
name = "waterkit-biometric"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform biometric authentication (FaceID, Fingerprint)"
keywords = ["biometric", "authentication", "faceid", "touchid", "fingerprint"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }

# Apple platforms (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
block2.workspace = true
futures.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSError",
    "NSObject",
    "NSString",
] }
objc2-local-authentication = { workspace = true, features = [
    "block2",
    "LABiometryType",
    "LAContext",
] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Security_Credentials_UI", "Foundation"] }

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["time"] }

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/BiometricHelper.kt"]
