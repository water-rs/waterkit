[package]
name = "waterkit-test-android"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
jni.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "time"] }
android_logger = "0.15"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
waterkit_content = { path = "../../..", package = "waterkit", default-features = false }
waterkit-test-report.workspace = true
# Saves converted camera frames for inspection.
image = { workspace = true, default-features = false, features = ["png"] }
# Draws the barcode test image at run time; the harness ships no fixtures.
qrcodegen = "1.8"
waterkit-build.workspace = true

[features]
full = [
    "sensor",
    "biometric",
    "location",
    "audio",
    "camera",
    "clipboard",
    "codec",
    "dialog",
    "fs",
    "haptic",
    "notification",
    "permission",
    "secret",
    "system",
    "video",
    "bluetooth",
    "nfc",
    "share",
    "speech",
    "deeplink",
    "contacts",
    "calendar",
    "health",
    "language",
    "screen",
    "background",
    "passkey",
    "otp",
    "vision",
    "wallet",
    "store",
]
sensor = ["waterkit_content/sensor"]
biometric = ["waterkit_content/biometric"]
location = ["waterkit_content/location"]
audio = ["waterkit_content/audio"]
camera = ["waterkit_content/camera"]
clipboard = ["waterkit_content/clipboard"]
codec = ["waterkit_content/codec"]
dialog = ["waterkit_content/dialog", "waterkit-build/activity-result"]
fs = ["waterkit_content/fs"]
haptic = ["waterkit_content/haptic"]
notification = ["waterkit_content/notification"]
permission = ["waterkit_content/permission"]
secret = ["waterkit_content/secret"]
system = ["waterkit_content/system"]
video = ["waterkit_content/video"]
bluetooth = ["waterkit_content/bluetooth"]
nfc = ["waterkit_content/nfc"]
share = ["waterkit_content/share"]
speech = ["waterkit_content/speech"]
deeplink = ["waterkit_content/deeplink"]
contacts = ["waterkit_content/contacts"]
calendar = ["waterkit_content/calendar"]
# Vision stills test the ML Kit clients alone; a live camera frame exercises
# the frame-plane path, so the camera cases and their helpers join the run.
vision = ["camera", "waterkit_content/vision"]
health = ["waterkit_content/health"]
language = ["waterkit_content/language"]
screen = ["waterkit_content/screen"]
background = ["waterkit_content/background"]
passkey = ["waterkit_content/passkey"]
otp = ["waterkit_content/otp"]
wallet = ["waterkit_content/wallet"]
store = ["waterkit_content/store"]


[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"