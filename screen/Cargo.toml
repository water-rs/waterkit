[package]
name = "waterkit-screen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "GPU-first zero-copy screen capture with wgpu texture output"
keywords = ["screen", "display", "capture", "gpu", "wgpu"]
categories = ["os", "gui", "multimedia"]

[lints]
workspace = true

[build-dependencies]
waterkit-build.workspace = true

[dependencies]
thiserror.workspace = true
wgpu.workspace = true
async-channel.workspace = true

# Desktop (screenshots crate for simple screenshot)
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
screenshots = "0.8"

# Apple platforms (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true
metal.workspace = true
core-foundation.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSObject"] }
objc2-io-surface.workspace = true

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
pollster = "0.4"
winit = "0.30"
