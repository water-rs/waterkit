[package]
name = "waterkit-passkey"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform passkey (WebAuthn) registration and authentication"
keywords = ["passkey", "webauthn", "authentication", "security"]
categories = ["os", "authentication"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

# Apple platforms (iOS, macOS) - native AuthenticationServices through objc2
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSObject",
    "NSProcessInfo",
    "NSString",
] }
objc2-authentication-services = { workspace = true, features = [
    "ASAuthorization",
    "ASAuthorizationController",
    "ASAuthorizationCredential",
    "ASAuthorizationRequest",
    "ASFoundation",
    "ASAuthorizationPlatformPublicKeyCredentialAssertion",
    "ASAuthorizationPlatformPublicKeyCredentialAssertionRequest",
    "ASAuthorizationPlatformPublicKeyCredentialDescriptor",
    "ASAuthorizationPlatformPublicKeyCredentialProvider",
    "ASAuthorizationPlatformPublicKeyCredentialRegistration",
    "ASAuthorizationPlatformPublicKeyCredentialRegistrationRequest",
    "ASAuthorizationPublicKeyCredentialAssertion",
    "ASAuthorizationPublicKeyCredentialAssertionRequest",
    "ASAuthorizationPublicKeyCredentialConstants",
    "ASAuthorizationPublicKeyCredentialRegistration",
    "ASAuthorizationPublicKeyCredentialRegistrationRequest",
    "ASPublicKeyCredential",
] }

# iOS - presentation anchors resolve through UIApplication scenes
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { workspace = true, features = [
    "UIApplication",
    "UIResponder",
    "UIScene",
    "UIView",
    "UIWindow",
    "UIWindowScene",
] }

# macOS - presentation anchors resolve through NSApplication
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSWindow"] }

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/PasskeyHelper.kt"]
