[package]
name = "waterkit-background"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform background task scheduling and execution hooks"
keywords = ["background", "scheduler", "ios", "android"]
categories = ["os", "asynchronous"]

[lints]
workspace = true

[dependencies]
async-channel.workspace = true
futures-core = "0.3"
thiserror.workspace = true

# iOS (and Mac Catalyst) - native BackgroundTasks through objc2
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
dispatch2.workspace = true
futures-channel = "0.3"
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSDate",
    "NSError",
    "NSObject",
    "NSProcessInfo",
    "NSProgress",
    "NSString",
] }
objc2-background-tasks = { workspace = true, features = [
    "block2",
    "dispatch2",
    "BGTask",
    "BGTaskRequest",
    "BGTaskScheduler",
] }

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true
