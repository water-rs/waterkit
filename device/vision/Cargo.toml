[package]
name = "waterkit-vision"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/water-rs/waterkit"
description = "Hardware-accelerated on-device vision requests over camera frames and still images"
keywords = ["vision", "image", "gpu", "ocr", "barcode"]
categories = ["multimedia::images", "multimedia::video"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
wgpu.workspace = true
bytes.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
icu_locale_core = { workspace = true, optional = true, features = ["alloc"] }
waterkit-camera = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "System_UserProfile",
] }

[features]
camera = ["dep:waterkit-camera"]
text = ["dep:icu_locale_core", "dep:windows"]

[dev-dependencies]
pollster.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
# Rasterizes the test-time text fixtures; no fonts are committed to the repo.
ab_glyph = "0.2"
image.workspace = true
