[package]
name = "waterkit-health"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform health data access (HealthKit / Health Connect)"
keywords = ["health", "fitness", "healthkit"]
categories = ["os"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
futures = { workspace = true }
blocking = { workspace = true }
serde = { workspace = true }
waterkit-fs = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
block2.workspace = true
objc2-health-kit = { workspace = true, features = [
    "HKCategorySample",
    "HKCategoryValues",
    "HKDefines",
    "HKHealthStore",
    "HKObject",
    "HKObjectType",
    "HKQuantity",
    "HKQuantitySample",
    "HKQuery",
    "HKSample",
    "HKSampleQuery",
    "HKSource",
    "HKSourceRevision",
    "HKTypeIdentifiers",
    "HKUnit",
    "block2",
    "std",
] }

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/HealthHelper.kt"]
maven = ["androidx.health.connect:connect-client:1.1.0"]