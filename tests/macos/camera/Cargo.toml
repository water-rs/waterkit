[package]
name = "waterkit-camera-test"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]

# The harness only runs on macOS, so its window and GPU stack is scoped to macOS
# rather than built for every target the workspace is swept with. `winit` in
# particular pulls in `android-activity`, which `compile_error!`s until an
# application selects a game-activity or native-activity backend - something a
# test harness cannot do.
[target.'cfg(target_os = "macos")'.dependencies]
waterkit-camera.workspace = true
shaderloom.workspace = true
winit.workspace = true
wgpu.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
futures.workspace = true
async-channel.workspace = true
env_logger = "0.11"
log.workspace = true

[build-dependencies]
shaderloom = { workspace = true, features = ["build"] }
