[package]
name = "waterkit-nfc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform NFC tag reading and writing"
keywords = ["nfc", "ndef", "rfid", "wireless"]
categories = ["os", "hardware-support"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
futures = { workspace = true }
futures-core = "0.3"
async-channel = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
waterkit-core.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-core-nfc = { workspace = true, features = ["block2", "dispatch2"] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSObject",
    "NSString",
] }

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Networking_Proximity",
    "Foundation",
    "Storage_Streams",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/NfcHelper.kt"]
