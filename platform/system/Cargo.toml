[package]
name = "waterkit-system"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "System information and power management"
keywords = ["system", "os", "thermal", "battery", "info"]
categories = ["os", "gui"]
readme = "README.md"
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# Desktop (System Info & Thermal)
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
sysinfo.workspace = true

# Windows connectivity: the Network List Manager reports internet
# connectivity, and the IP Helper adapter table names the transport.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
] }

# Linux connectivity: NetworkManager over the system bus where it runs, the
# kernel's interface and route tables otherwise.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tracing.workspace = true

# Apple (iOS/macOS): `objc2-network` is generated on `objc2`'s main branch
# but not yet released; `block2`/`dispatch2` come from the same pinned revision
# so their `Block`/`DispatchQueue` types match `objc2-network`'s API.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { git = "https://github.com/madsmtm/objc2", rev = "e45c53301628aec4ead5c086dde282942ca972db" }
dispatch2 = { git = "https://github.com/madsmtm/objc2", rev = "e45c53301628aec4ead5c086dde282942ca972db" }
libc = "0.2"
objc2-foundation = { workspace = true, features = ["NSProcessInfo"] }
objc2-network = { workspace = true, features = ["std", "dispatch2"] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/SystemHelper.kt"]
