// apt has no overall deadline: a mirror connection that stalls after the
// handshake holds `apt-get` until the job's own timeout (the Coverage job's
// apt step took 2434 s in run 37339267535). Every apt call in the workflows
// and composite actions reads this file, so each connection is bounded and
// retried.
Acquire::Retries "3";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
