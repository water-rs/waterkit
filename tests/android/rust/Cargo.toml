[package]
name = "waterkit-test-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
android_logger = "0.15"
log.workspace = true
waterkit_content = { path = "../../..", package = "waterkit", default-features = false }
waterkit-test-report.workspace = true

[features]
full = [
    "sensor",
    "biometric",
    "location",
    "audio",
    "camera",
    "clipboard",
    "codec",
    "dialog",
    "fs",
    "haptic",
    "notification",
    "permission",
    "secret",
    "system",
    "video",
    "bluetooth",
    "nfc",
    "share",
    "speech",
    "deeplink",
    "contacts",
    "calendar",
    "health",
    "screen",
    "background",
    "passkey",
]
sensor = ["waterkit_content/sensor"]
biometric = ["waterkit_content/biometric"]
location = ["waterkit_content/location"]
audio = ["waterkit_content/audio"]
camera = ["waterkit_content/camera"]
clipboard = ["waterkit_content/clipboard"]
codec = ["waterkit_content/codec"]
dialog = ["waterkit_content/dialog"]
fs = ["waterkit_content/fs"]
haptic = ["waterkit_content/haptic"]
notification = ["waterkit_content/notification"]
permission = ["waterkit_content/permission"]
secret = ["waterkit_content/secret"]
system = ["waterkit_content/system"]
video = ["waterkit_content/video"]
bluetooth = ["waterkit_content/bluetooth"]
nfc = ["waterkit_content/nfc"]
share = ["waterkit_content/share"]
speech = ["waterkit_content/speech"]
deeplink = ["waterkit_content/deeplink"]
contacts = ["waterkit_content/contacts"]
calendar = ["waterkit_content/calendar"]
health = ["waterkit_content/health"]
screen = ["waterkit_content/screen"]
background = ["waterkit_content/background"]
passkey = ["waterkit_content/passkey"]


[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
