[package]
name = "waterkit-haptic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform haptic feedback and vibrations"
keywords = ["haptic", "vibration", "feedback"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
thiserror = { workspace = true }
# Apple platforms (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
objc2-core-haptics = { workspace = true, features = [
    "CHHapticDeviceCapability",
    "CHHapticEngine",
    "CHHapticEvent",
    "CHHapticParameter",
    "CHHapticPattern",
    "CHHapticPatternPlayer",
    "block2",
] }
objc2-foundation = { workspace = true, features = ["NSArray"] }
objc2-ui-kit = { workspace = true, features = [
    "UIFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "UINotificationFeedbackGenerator",
    "UISelectionFeedbackGenerator",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSHapticFeedback"] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true
waterkit-build.workspace = true


# Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Devices_Haptics", "Foundation"] }
futures = { workspace = true }

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
futures.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/HapticHelper.kt"]
