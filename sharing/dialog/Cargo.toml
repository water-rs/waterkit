[package]
name = "waterkit-dialog"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Native dialogs and pickers"
keywords = ["dialog", "picker", "native", "alert"]
categories = ["os", "gui"]
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures = { workspace = true }
thiserror = { workspace = true }
waterkit-fs = { workspace = true }
roxmltree = "0.21"

# iOS - native dialogs/pickers through objc2
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
dispatch2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSError",
    "NSFileManager",
    "NSItemProvider",
    "NSProcessInfo",
    "NSSet",
    "NSString",
    "NSURL",
    "NSUUID",
] }
objc2-photos = { workspace = true, features = [
    "block2",
    "PHAsset",
    "PHAssetResource",
    "PHAssetResourceManager",
    "PHFetchOptions",
    "PHFetchResult",
    "PHObject",
    "PhotosTypes",
] }
objc2-photos-ui = { workspace = true, features = ["PHPicker"] }
objc2-ui-kit = { workspace = true, features = [
    "block2",
    "UIAlertController",
    "UIApplication",
    "UIDocumentPickerViewController",
    "UIResponder",
    "UIScene",
    "UISceneDefinitions",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
objc2-uniform-type-identifiers = { workspace = true, features = ["UTType"] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
waterkit-build = { workspace = true, features = ["activity-result"] }

# Desktop (macOS, Windows, Linux)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { workspace = true }

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/DialogHelper.kt"]
