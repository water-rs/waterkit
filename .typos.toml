[default.extend-words]
# ISO base media file format box names, spelled as the specification spells
# them. `trun` is the track fragment run box, alongside `trak`.
trak = "trak"
trun = "trun"
# MaxCLL, the HDR maximum content light level metadata field.
CLL = "CLL"
# JNI type signatures, where each letter names a type: `(IZ)V` is a method
# taking an int and a boolean and returning void. Respelling these breaks
# every method descriptor they appear in.
IZ = "IZ"
# nokhwa spells its format-request setter `set_camera_requset`; calling it
# needs the upstream spelling.
requset = "requset"
# Mirrors the `seek` API it reports on, rather than the English past tense.
seeked = "seeked"
thw = "thw"
cose = "cose"
COSE = "COSE"
formatable = "formatable"
NdefFormatable = "NdefFormatable"
cros = "cros"
# Apple's Unique Device Identifier, as `devicectl` and Xcode name it.
UDID = "UDID"
# Win32 accelerator flag on `ACCEL::fVirt`, alongside FSHIFT and FCONTROL.
FALT = "FALT"
