[package]
name = "waterkit-codec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "GPU-first zero-copy video codec with wgpu texture output"
keywords = ["codec", "video", "wgpu", "gpu", "h264", "h265", "av1"]
categories = ["multimedia::video", "graphics"]

[dependencies]
thiserror.workspace = true
wgpu.workspace = true

# Software fallback codecs (private, not exposed in public API)
# Only enabled on desktop platforms - mobile has hardware codecs
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rav1e = { workspace = true, optional = true }
dav1d = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-video-toolbox.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-io-surface.workspace = true
metal.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media", "api-level-29"] }
ndk-sys = "0.6"
jni.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-next = "7"

[features]
default = ["software-fallback"]
software-fallback = ["dep:rav1e", "dep:dav1d"]

[lints]
workspace = true
