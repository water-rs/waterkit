[package]
name = "waterkit-calendar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform calendar and events access"
keywords = ["calendar", "events", "schedule"]
categories = ["os"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
futures = { workspace = true }
blocking = { workspace = true }
serde = { workspace = true }
waterkit-fs = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSDate", "NSError", "NSString"] }
objc2-core-graphics.workspace = true
objc2-event-kit = { workspace = true, features = [
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKTypes",
    "bitflags",
    "block2",
    "std",
    "objc2-core-graphics",
] }
block2.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/CalendarHelper.kt"]