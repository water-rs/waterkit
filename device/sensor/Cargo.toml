[package]
name = "waterkit-sensor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Cross-platform sensor access"
keywords = ["sensor", "accelerometer", "gyroscope", "magnetometer"]
categories = ["os", "gui"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
futures.workspace = true
futures-core = "0.3"
thiserror = { workspace = true }
futures-timer = { workspace = true }
async-channel = { workspace = true }

# Apple platforms (iOS, macOS)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2-foundation = { workspace = true, features = ["NSError", "NSOperation", "NSValue"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-core-motion = { workspace = true, features = [
    "block2",
    "CMAccelerometer",
    "CMAltimeter",
    "CMAltitude",
    "CMGyro",
    "CMLogItem",
    "CMMagnetometer",
    "CMMotionManager",
] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"
objc2-core-foundation = { workspace = true, features = ["CFDictionary"] }
objc2-io-kit = { workspace = true, features = ["libc"] }

# Android
[target.'cfg(target_os = "android")'.dependencies]
waterkit-build.workspace = true
jni.workspace = true
ndk-context.workspace = true

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Devices_Sensors",
    "Foundation",
] }

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
serde.workspace = true

# Android helper classes the packager compiles into the application's
# classpath (see water-rs/cli's android backend).
[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/SensorHelper.kt"]
