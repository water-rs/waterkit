[package]
name = "waterkit-language"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "On-device language translation through system translation services"
keywords = ["language", "translation", "localization"]
categories = ["localization", "os"]

[lints]
workspace = true

[dependencies]
waterkit-core = { workspace = true }
icu_locale_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
swift-bridge.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
waterkit-build = { workspace = true, features = ["native-callback"] }
jni.workspace = true
ndk-context.workspace = true

[build-dependencies]
waterkit-build = { workspace = true, features = ["native-callback", "swift-bridge"] }

[dev-dependencies]
futures.workspace = true

[package.metadata.waterui.android]
kotlin-sources = ["src/sys/android/TranslationHelper.kt"]

[[package.metadata.waterui.android.keep]]
class = "waterkit.language.TranslationHelper"
members = [
    "public static boolean isApiSupported()",
    "public static void getCapabilities(android.content.Context, waterkit.build.NativeCallback)",
    "public static void createTranslator(android.content.Context, java.lang.String, java.lang.String, waterkit.build.NativeCallback)",
    "public static android.os.CancellationSignal translate(android.view.translation.Translator, waterkit.build.NativeCallback, java.lang.String)",
    "public static java.lang.String openDownloadSettings(android.content.Context)",
    "public static waterkit.language.CapabilityUpdates registerCapabilityUpdates(android.content.Context, waterkit.build.NativeChannel)",
]

[[package.metadata.waterui.android.keep]]
class = "waterkit.language.CapabilityUpdates"
members = ["public void close()"]
